version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    cooldown:
      default-days: 3
    pull-request-branch-name:
      separator: '-'
    target-branch: main
    labels:
      - dependabot
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      aws-sdk:
        patterns:
          - '@aws-sdk/*'
          - '@aws-crypto/*'
          - '@smithy/*'
      aws-lambda-powertools:
        patterns:
          - '@aws-lambda-powertools/*'
      middy:
        patterns:
          - '@middy/*'
      govuk-one-login:
        patterns:
          - '@govuk-one-login/*'
      cucumber:
        patterns:
          - '@cucumber/*'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      lint-format:
        patterns:
          - 'oxfmt'
          - 'oxlint'
          - 'oxlint-tsgolint'
          - 'eslint-plugin-perfectionist'
      esbuild:
        patterns:
          - 'esbuild'
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    commit-message:
      prefix: BAU
  - package-ecosystem: 'docker'
    directory: '/test/acceptance-tests'
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    cooldown:
      default-days: 3
    target-branch: main
    labels:
      - dependabot
    groups:
      docker:
        patterns:
          - '*'
    commit-message:
      prefix: BAU
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    cooldown:
      default-days: 3
    target-branch: main
    labels:
      - dependabot
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: BAU
