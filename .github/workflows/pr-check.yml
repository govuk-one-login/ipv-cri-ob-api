name: PR check

on: pull_request
permissions: {}

jobs:
  pre-commit:
    name: Run pre-commit
    runs-on: ubuntu-latest
    concurrency:
      group: pre-commit-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Run pre-commit
        uses: govuk-one-login/github-actions/code-quality/run-pre-commit@3a8d0b3fdd010f27ed9cbb2b6c426cd56a23b3e4
        with:
          all-files: true
          install-dependencies: 'true'
          node-version-file: '.nvmrc'

  unit-tests:
    name: Run unit tests
    permissions:
      contents: read
    uses: ./.github/workflows/run-unit-tests.yml

  scan-repo:
    name: CodeQL and Sonar scans
    permissions:
      contents: read
      security-events: write
    if: ${{ github.actor != 'dependabot[bot]' }}
    needs: unit-tests
    uses: ./.github/workflows/scan-repo.yml
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}

  # pact test placeholder

  infra-tests:
    name: Run infra tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: infra-tests-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Setup Node
        uses: govuk-one-login/github-actions/node/install-dependencies@3a8d0b3fdd010f27ed9cbb2b6c426cd56a23b3e4
        with:
          node-version-file: '.nvmrc'

      - name: CloudFormation template tests
        run: npm run test:infra

  deploy-preview:
    name: Deploy preview stack
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-preview.yml
    secrets:
      role_arn: ${{ secrets.DEV_GHA_PREVIEW_ROLE_ARN }}
      bucket_name: ${{ secrets.DEV_PREVIEW_ARTIFACT_BUCKET }}

  api-tests:
    name: Run api tests
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: api-tests-${{ github.event.pull_request.number }}
    needs: deploy-preview
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: govuk-one-login/github-actions/node/install-dependencies@3a8d0b3fdd010f27ed9cbb2b6c426cd56a23b3e4
        with:
          node-version-file: '.nvmrc'

      - name: Assume AWS Role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.DEV_GHA_PREVIEW_ROLE_ARN }}
          aws-region: ${{ needs.deploy-preview.outputs.aws-region }}

      - name: Wait 2 mins for stack to stabilise (TODO - remove post LIME-2470)
        run: sleep 120

      - name: Run tests
        env:
          SAM_STACK_NAME: ${{ needs.deploy-preview.outputs.stack-name }}
          AWS_REGION: ${{ needs.deploy-preview.outputs.aws-region }}
        run: bash test/acceptance-tests/run-tests.sh false

      - name: Delete preview test stack
        if: always()
        run: |
          aws cloudformation delete-stack --region eu-west-2 --stack-name ${{ needs.deploy-preview.outputs.stack-name }}

  merge-status:
    name: Merge status
    runs-on: ubuntu-latest
    concurrency:
      group: merge-status-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    needs:
      - pre-commit
      - unit-tests
      - api-tests
      - infra-tests
    if: always()
    steps:
      - run: |
          failed=()
          [[ "${{ needs.pre-commit.result }}" != "success" ]] && failed+=("pre-commit")
          [[ "${{ needs.unit-tests.result }}" != "success" ]] && failed+=("unit-tests")
          [[ "${{ needs.api-tests.result }}" != "success" ]] && failed+=("api-tests")
          [[ "${{ needs.infra-tests.result }}" != "success" ]] && failed+=("infra-tests")
          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "The following jobs failed: ${failed[*]}"
            exit 1
          fi
