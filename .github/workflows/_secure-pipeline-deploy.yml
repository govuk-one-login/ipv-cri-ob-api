name: Build and deploy

on:
  workflow_call:
    secrets:
      role_arn:
        required: true
      artifact_bucket:
        required: true
      ecr_repository_test:
        required: true
      ecr_repository_traffic_test:
        required: true
      container_sign_kms_key:
        required: true
      signing_profile:
        required: true
    inputs:
      environment:
        type: string
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: secure-deploy-${{ inputs.environment }}

jobs:
  test-images-build-and-push:
    name: Test images build and push
    runs-on: ubuntu-latest
    steps:
      - name: Test image build and push
        uses: govuk-one-login/devplatform-upload-action-ecr@d839fc3ead8c9d9f18f7a8cceb7ab4a3eab18a58 # v1.7.0
        with:
          artifact-bucket-name: ''
          role-to-assume-arn: ${{ secrets.role_arn }}
          build-and-push-image-only: true
          ecr-repo-name: ${{ secrets.ecr_repository_test }}
          dockerfile: test/acceptance-tests/test.Dockerfile
          push-latest-tag: true
          container-sign-kms-key-arn: ${{ secrets.container_sign_kms_key }}

      - name: Traffic test image build and push
        uses: govuk-one-login/devplatform-upload-action-ecr@d839fc3ead8c9d9f18f7a8cceb7ab4a3eab18a58 # v1.7.0
        with:
          artifact-bucket-name: ''
          role-to-assume-arn: ${{ secrets.role_arn }}
          build-and-push-image-only: true
          ecr-repo-name: ${{ secrets.ecr_repository_traffic_test }}
          dockerfile: test/acceptance-tests/traffic-test.Dockerfile
          push-latest-tag: true
          container-sign-kms-key-arn: ${{ secrets.container_sign_kms_key }}

  deploy:
    name: Deploy stack
    runs-on: ubuntu-latest
    needs: test-images-build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: SAM build
        uses: govuk-one-login/github-actions/sam/build-application@3a8d0b3fdd010f27ed9cbb2b6c426cd56a23b3e4
        with:
          template: deploy/template.yaml
          aws-role-arn: ${{ secrets.role_arn }}

      - name: SAM package and upload to S3
        uses: govuk-one-login/devplatform-upload-action/sam@9320b8e71484f79c1b48139a86d214473d0f2709 # v4.3.0
        with:
          aws-role-arn: ${{ secrets.role_arn}}
          artifact-bucket-name: ${{ secrets.artifact_bucket }}
          signing-profile-name: ${{ secrets.signing_profile }}
          working-directory: .aws-sam/build
