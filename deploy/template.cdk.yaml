                responses:
                  default:
                    statusCode: "200"
                    responseParameters:
                      method.response.header.Cache-Control: "'max-age=300'"
                passthroughBehavior: when_no_match
                contentHandling: CONVERT_TO_TEXT
                type: aws
          /token:
