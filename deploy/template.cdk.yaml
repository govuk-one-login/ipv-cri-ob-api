                  Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${IssueCredentialFunction.Arn}:live/invocations
                responses:
                  default:
                    statusCode: "200"
                passthroughBehavior: when_no_match
                contentHandling: CONVERT_TO_TEXT
                type: aws_proxy
        components:
          schemas:
            JWKSFile:
              type: object
              required:
                - keys
              additionalProperties: true
              properties:
                keys:
                  type: array
                  description: The value of the `keys` parameter is an array of JWK values. By default, the order of the JWK values within the array does not imply an order of preference among them, although applications of JWK Sets can choose to assign a meaning to the order for their purposes, if desired.
                  items:
                    type: object
                    additionalProperties: true
                    description: A JSON Web Key (JWK) as defined by [RFC7517](https://www.rfc-editor.org/rfc/rfc7517)
                    properties:
                      kty:
                        type: string
                        description: The `kty` (key type) parameter identifies the cryptographic algorithm family used with the key, such as `RSA or `EC`
                      use:
                        type: string
                        enum:
                          - sig
                          - enc
                        description: The "use" (public key use) parameter identifies the intended use of the public key.  The "use" parameter is employed to indicate whether a public key is used for encrypting data or verifying the signature on data. Valid values are `sig` (signature) and `enc` (encryption).
                      alg:
                        type: string
                        description: The `alg` (algorithm) parameter identifies the algorithm intended for use with the key.
                      kid:
                        type: string
                        description: The `kid` (key ID) parameter is used to match a specific key. This is used, for instance, to choose among a set of keys within a JWK Set during key rollover.  The structure of the `kid` value is unspecified.
                      e:
                        type: string
                        description: public exponent
                      "n":
                        type: string
                        description: public modulus
                    required:
                      - kty
            VcResponse:
              title: Vc
              type: string
              format: application/jwt
              pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
            TokenResponse:
              title: AccessToken
