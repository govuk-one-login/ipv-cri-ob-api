  StubBankListSizeDropAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      ActionsEnabled: true
      AlarmActions:
        - Fn::ImportValue: build-notifications-WarningAlertsTopicArn
      AlarmDescription: STUB bank list size dropped by more than 10% between updater runs.
      AlarmName:
        Fn::Sub: ${AWS::StackName}-${Environment}-bank-list-size-drop-stub
      ComparisonOperator: LessThanThreshold
      DatapointsToAlarm: 1
      EvaluationPeriods: 60
      Metrics:
        - Expression: 100 * DIFF(size) / (size - DIFF(size))
          Id: change
          Label: Percentage change in bank list size
          ReturnData: true
        - Id: size
          MetricStat:
            Metric:
              Dimensions:
                - Name: service
                  Value:
                    Fn::Sub: ${CriIdentifier}-bank-list-updater
                - Name: endpoint_profile
                  Value: STUB
              MetricName: bank_list_size
              Namespace:
                Ref: CriIdentifier
            Period: 60
            Stat: Minimum
          ReturnData: false
      Threshold: -10
      TreatMissingData: notBreaching
    Condition: CreateStubEndpointProfileResources
