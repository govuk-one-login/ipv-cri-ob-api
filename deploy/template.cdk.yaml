                        type: string
                    Content-Type:
                      schema:
                        type: string
                    Strict-Transport-Security:
                      schema:
                        type: string
                    X-Content-Type-Options:
                      schema:
                        type: string
                    X-Frame-Options:
                      schema:
                        type: string
