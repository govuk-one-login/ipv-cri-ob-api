                  description: 403 response
                  content:
                    application/json:
                      schema:
                        $ref: "#/components/schemas/Error"
                "500":
                  description: 500 response
                  content:
                    application/json:
                      schema:
                        $ref: "#/components/schemas/Error"
              x-amazon-apigateway-request-validator: Validate both
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri:
                  Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${OAuth.Outputs.LambdaAuthorizationFunctionName}:live/invocations
                passthroughBehavior: when_no_match
          /session:
            post:
              summary: IP address of the client.
              parameters:
                - in: header
                  name: X-Forwarded-For
                  schema:
                    type: string
                    format: string
                  required: false
              requestBody:
                content:
                  application/json:
                    schema:
                      $ref: "#/components/schemas/Authorization"
                    examples:
                      "201":
                        description: Example body to receive a HTTP 201 response
                        value:
                          session_id: 1fbc5730-9d17-416d-b2ca-0be90e1e93f5
                      "400":
                        description: Example body to receive a HTTP 400 response
                        value:
                          session_id: fad21bea-bce9-4aa7-8889-d50c7d26616e
                      "500":
                        description: Example body to receive a HTTP 500 response
                        value:
                          session_id: f27b8afc-90ef-4e0f-83ad-00a2f5692590
                required: true
              responses:
                "201":
                  description: 201 response
                  content:
                    application/json:
                      schema:
                        $ref: "#/components/schemas/Session"
                      examples:
                        "201":
                          summary: An example of a successful response message
                          value:
                            session_id: 1fbc5730-9d17-416d-b2ca-0be90e1e93f5
                            state: string
                            redirect_uri: string
                "400":
                  description: 400 response
                  content:
                    application/json:
                      schema:
                        $ref: "#/components/schemas/Error"
                "500":
                  description: 500 response
                  content:
                    application/json:
                      schema:
                        $ref: "#/components/schemas/Error"
              x-amazon-apigateway-request-validator: Validate both
              x-amazon-apigateway-integration:
                httpMethod: POST
                uri:
                  Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${OAuth.Outputs.LambdaSessionFunctionName}:live/invocations
                responses:
                  default:
                    statusCode: "200"
                passthroughBehavior: when_no_match
                contentHandling: CONVERT_TO_TEXT
                type: aws_proxy
        components:
          parameters:
            SessionHeader:
              name: session-id
              in: header
              description: A UUID generated by the Session API to act as a primary key for the Session in DynamoDB
              required: true
              schema:
                type: string
          schemas:
            EmptyBody:
              type: object
              nullable: true
            Authorization:
              required:
                - client_id
                - request
              type: object
              properties:
                client_id:
                  type: string
                  minLength: 1
                  example: ipv-core-stub
                request:
                  type: string
            AuthorizationResponse:
              required:
                - redirect_uri
                - code
                - state
              type: object
              properties:
                code:
                  type: string
                  example: 1fbc5730-9d17-416d-b2ca-0be90e1e93f5
                state:
                  type: string
                  example: state
                  minLength: 1
                redirect_uri:
                  type: string
                  format: uri
                  example: https://di-ipv-core-stub.london.cloudapps.digital/callback
            Error:
              title: Error Schema
              type: object
              properties:
                message:
                  type: string
            Session:
              required:
                - session_id
                - state
                - redirect_uri
              type: object
              properties:
                session_id:
                  type: string
                state:
                  type: string
                redirect_uri:
                  type: string
            BankList:
              required:
                - banks
                - profile
                - refreshedAtSeconds
              type: object
              properties:
                banks:
                  type: array
                  items:
                    $ref: "#/components/schemas/Bank"
                profile:
                  type: string
                  enum:
                    - LIVE
                    - STUB
                    - UAT
                refreshedAtSeconds:
                  type: integer
                  format: int64
            Bank:
              required:
                - bankId
                - friendlyName
                - serviceStatus
              type: object
              properties:
                bankId:
                  type: string
                friendlyName:
                  type: string
                serviceStatus:
                  type: boolean
            ConsentsRequest:
              required:
                - bank_id
                - return_url
              type: object
              properties:
                bank_id:
                  type: string
                  minLength: 1
                  example: example-bank
                return_url:
                  description: The http or https URL the bank redirects the user back to. This must match what is set in the Ecospend client used for the deployment account, which rejects any other value.
                  type: string
                  format: uri
                  example: https://review-ob.dev.account.gov.uk/return
            Consent:
              required:
                - id
                - url
                - urlExpiresAtSeconds
              type: object
              properties:
                id:
                  description: The Ecospend consent id
                  type: string
                  example: 1fbc5730-9d17-416d-b2ca-0be90e1e93f5
                url:
                  description: The bank consent URL the user is sent to. Valid for 4 minutes
                  type: string
                  format: uri
                urlExpiresAtSeconds:
                  description: Epoch seconds at which the bank consent URL stops being valid
                  type: integer
                  format: int64
            CachedConsent:
              allOf:
                - $ref: "#/components/schemas/Consent"
                - required:
                    - cached
                  type: object
                  properties:
                    cached:
                      type: boolean
                      enum:
                        - true
        x-amazon-apigateway-request-validators:
          Validate both:
            validateRequestBody: true
            validateRequestParameters: true
          Validate Param only:
            validateRequestParameters: true
            validateRequestBody: false
      Description: Private Open Banking CRI API
      EndpointConfiguration:
        Type:
          Fn::If:
            - IsDeployedFromPipeline
            - PRIVATE
            - REGIONAL
      MethodSettings:
        - DataTraceEnabled:
            Fn::If:
              - IsProduction
              - false
              - true
          HttpMethod: "*"
          LoggingLevel: INFO
          MetricsEnabled: true
          ResourcePath: /*
          ThrottlingBurstLimit: 400
          ThrottlingRateLimit: 200
      Name:
        Fn::Sub: ${AWS::StackName}-PrivateOpenBankingAPI
      OpenApiVersion: 3.0.1
      StageName:
        Ref: Environment
      Tags:
        CustomPolicy: "true"
        FMSRegionalPolicy: "false"
      TracingEnabled: true
  PrivateAPIUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      ApiStages:
        - ApiId:
            Ref: PrivateAPI
          Stage:
            Ref: Environment
      Quota:
        Limit: 500000
        Period: DAY
      Throttle:
        BurstLimit: 400
        RateLimit: 200
    Condition: IsDeployedFromPipeline
    DependsOn:
      - PrivateAPIStage
  APIGW5XXErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      ActionsEnabled: true
      AlarmActions:
        - Fn::If:
            - IsProduction
            - Fn::ImportValue: build-notifications-PagerDutySNSTopicArn
            - Fn::ImportValue: build-notifications-CriticalAlertsTopicArn
      AlarmDescription:
        Fn::Sub: OpenBanking ${Environment} API Gateway 5XX errors
      AlarmName:
        Fn::Sub: ${AWS::StackName}-${Environment}-api-gateway-5xx-errors
      ComparisonOperator: GreaterThanThreshold
      DatapointsToAlarm: 3
      EvaluationPeriods: 3
      Metrics:
        - Expression: SUM(METRICS())
          Id: total
          Label: Total 5XX errors
          ReturnData: true
        - Id: public
          MetricStat:
            Metric:
              Dimensions:
                - Name: ApiName
                  Value:
                    Fn::Sub: ${AWS::StackName}-PublicOpenBankingAPI
              MetricName: 5XXError
              Namespace: AWS/ApiGateway
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: private
          MetricStat:
            Metric:
              Dimensions:
                - Name: ApiName
                  Value:
                    Fn::Sub: ${AWS::StackName}-PrivateOpenBankingAPI
              MetricName: 5XXError
              Namespace: AWS/ApiGateway
            Period: 300
            Stat: Sum
          ReturnData: false
      OKActions:
        - Fn::If:
            - IsProduction
            - Fn::ImportValue: build-notifications-PagerDutySNSTopicArn
            - Fn::ImportValue: build-notifications-CriticalAlertsTopicArn
      Threshold: 1
      TreatMissingData: notBreaching
    Condition: IsDeployedFromPipeline
  LambdaErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      ActionsEnabled: true
      AlarmActions:
        - Fn::If:
            - IsProduction
            - Fn::ImportValue: build-notifications-PagerDutySNSTopicArn
            - Fn::ImportValue: build-notifications-CriticalAlertsTopicArn
      AlarmDescription:
        Fn::Sub: OpenBanking ${Environment} lambda errors
      AlarmName:
        Fn::Sub: ${AWS::StackName}-${Environment}-lambda-errors
      ComparisonOperator: GreaterThanThreshold
      DatapointsToAlarm: 3
      Dimensions: []
      EvaluationPeriods: 3
      MetricName: Errors
      Namespace: AWS/Lambda
      OKActions:
        - Fn::If:
            - IsProduction
            - Fn::ImportValue: build-notifications-PagerDutySNSTopicArn
            - Fn::ImportValue: build-notifications-CriticalAlertsTopicArn
      Period: 300
      Statistic: Sum
      Threshold: 1
      TreatMissingData: notBreaching
    Condition: IsDeployedFromPipeline
Outputs:
  PublicApiGatewayId:
    Description: Public Open Banking CRI API gateway ID
    Value:
      Ref: PublicAPI
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-PublicAPIGatewayID
  PublicApiBaseUrl:
    Description: Base url of the Public Open Banking CRI API gateway
    Value:
      Fn::Sub: https://${PublicAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-PublicAPIBaseUrl
  IpvCoreBackApiKeyId:
    Description: The ID of the API key used by IPV Core to access the public API gateway
    Value:
      Ref: LinkUsagePlanApiKey1
    Condition: IsDeployedFromPipeline
  PrivateApiGatewayId:
    Description: Private Open Banking CRI API gateway ID
    Value:
      Ref: PrivateAPI
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-PrivateAPIGatewayID
  PrivateApiBaseUrl:
    Description: Base url of the Private Open Banking CRI API gateway
    Value:
      Fn::Sub: https://${PrivateAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-PrivateAPIBaseUrl
  StackName:
    Description: CloudFormation stack name
    Value:
      Ref: AWS::StackName
