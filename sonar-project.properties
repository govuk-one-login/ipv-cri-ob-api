sonar.projectKey=govuk-one-login_ipv-cri-ob-api
sonar.organization=govuk-one-login

# Source files
sonar.sources=src,infra

# Tests
sonar.tests=test
sonar.test.inclusions=**/*.test.ts

# CDK's Template assertions (hasResourceProperties, hasCondition, …) are not considered assertions by sonar
sonar.issue.ignore.multicriteria=cdkAssertions
sonar.issue.ignore.multicriteria.cdkAssertions.ruleKey=typescript:S2699
sonar.issue.ignore.multicriteria.cdkAssertions.resourceKey=test/infra/cdk/**/*.test.ts

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# only the unit suite reports coverage
sonar.coverage.exclusions=infra/**
