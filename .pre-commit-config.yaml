repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
        name: check json
      - id: end-of-file-fixer
        name: fix end of files
      - id: trailing-whitespace
        name: trim trailing whitespace
      - id: detect-aws-credentials
        name: detect aws credentials
        args: [--allow-missing-credentials]
      - id: detect-private-key
        name: detect private keys

  # before cfn-lint so it lints the freshest template
  - repo: local
    hooks:
      - id: infra-synth
        name: synthesise infra into cloud assembly
        entry: npm run infra:synth
        language: system
        pass_filenames: false

  - repo: https://github.com/aws-cloudformation/cfn-lint
    rev: v1.46.0
    hooks:
      - id: cfn-lint
        name: cfn lint
        files: template(\.cdk)?\.ya?ml$

  - repo: https://github.com/bridgecrewio/checkov.git
    rev: 3.2.506
    hooks:
      - id: checkov
        name: checkov
        files: template(\.cdk)?\.ya?ml$
        args: [--soft-fail]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: ^deploy/template\.cdk\.yaml$

  - repo: local
    hooks:
      - id: oxlint
        name: oxlint
        entry: npm run lint:fix --
        language: system
        pass_filenames: true
        types_or: [javascript, ts]
      - id: oxfmt
        name: oxfmt
        entry: npm run format:fix --
        language: system
        pass_filenames: true
        types_or: [javascript, ts, json, css, scss]
      - id: type-check
        name: type check
        entry: npm run type-check
        language: system
        pass_filenames: false
